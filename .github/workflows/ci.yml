name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ros
          POSTGRES_PASSWORD: ros_dev_password
          POSTGRES_DB: restaurant_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ros" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ros:ros_dev_password@localhost:5432/restaurant_os_test?schema=public
      TEST_DATABASE_URL: postgresql://ros:ros_dev_password@localhost:5432/restaurant_os_test?schema=public
      SHADOW_DATABASE_URL: postgresql://ros:ros_dev_password@localhost:5432/ros_shadow?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789
      # Rate-limit storage tests and the whole e2e suite run against a real Redis.
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Create shadow database
        run: PGPASSWORD=ros_dev_password psql -h localhost -U ros -d restaurant_os_test -c 'CREATE DATABASE ros_shadow'
      - name: Schema drift check (migrations == schema.prisma)
        run: pnpm db:drift-check
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (real PostgreSQL)
        run: pnpm test:e2e
      - name: Load test (smoke)
        run: LOAD_ORDERS=300 LOAD_READS=30 pnpm load-test
      - name: Build
        run: pnpm build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ros
          POSTGRES_PASSWORD: ros_dev_password
          POSTGRES_DB: restaurant_os_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ros" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://ros:ros_dev_password@localhost:5432/restaurant_os_e2e?schema=public
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build the API the browser tests run against
        working-directory: apps/api
        run: pnpm prisma:generate && pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (real API, real PostgreSQL; builds the app)
        run: pnpm test:e2e
      - name: Upload the report when browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t restaurant-os-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t restaurant-os-web:ci .
