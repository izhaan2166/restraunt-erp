# Local stack: PostgreSQL, Redis, a one-off migrate/seed job, and the API.
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ros_dev_password}
      POSTGRES_DB: restaurant_os
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ros -d restaurant_os"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ros:${POSTGRES_PASSWORD:-ros_dev_password}@postgres:5432/restaurant_os?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && node dist-seed/prisma/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ros:${POSTGRES_PASSWORD:-ros_dev_password}@postgres:5432/restaurant_os?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
